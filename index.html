    const RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];

    function getHandLabel(r, c) {
      const r1 = RANKS[r];
      const r2 = RANKS[c];
      if (r === c) return `${r1}${r2}`;
      if (r < c) return `${r1}${r2}s`;
      return `${r2}${r1}o`;
    }

    function getHandCombos(hand) {
      if (hand.length === 2) return 6;
      if (hand.endsWith("s")) return 4;
      return 12;
    }

    function getAll169Hands() {
      const list = [];
      for (let r = 0; r < 13; r++) {
        for (let c = 0; c < 13; c++) {
          list.push(getHandLabel(r, c));
        }
      }
      return list;
    }

    function buildRangeMap(spec) {
      const map = {};
      for (const h of getAll169Hands()) {
        map[h] = { raise: 0, call: 0, fold: 100 };
      }
      if (spec.pureRaise) {
        for (const h of spec.pureRaise) map[h] = { raise: 100, call: 0, fold: 0 };
      }
      if (spec.pureCall) {
        for (const h of spec.pureCall) map[h] = { raise: 0, call: 100, fold: 0 };
      }
      if (spec.mixedRaise) {
        for (const [h, rPct] of Object.entries(spec.mixedRaise)) {
          map[h] = { raise: rPct, call: 0, fold: 100 - rPct };
        }
      }
      if (spec.mixedCall) {
        for (const [h, v] of Object.entries(spec.mixedCall)) {
          map[h] = { raise: v.raise, call: v.call, fold: Math.max(0, 100 - v.raise - v.call) };
        }
      }
      return map;
    }

    function computeSummary(freqs) {
      let rC = 0, cC = 0, fC = 0;
      for (const [h, f] of Object.entries(freqs)) {
        const cb = getHandCombos(h);
        rC += (cb * f.raise) / 100;
        cC += (cb * f.call) / 100;
        fC += (cb * f.fold) / 100;
      }
      return {
        raisePct: Number(((rC / 1326) * 100).toFixed(1)),
        callPct: Number(((cC / 1326) * 100).toFixed(1)),
        foldPct: Number(((fC / 1326) * 100).toFixed(1)),
        totalCombosPlayed: Math.round(rC + cC),
      };
    }

    function buildHeroDeviation(gto, mode) {
      const hero = {};
      const suitedWheels = ["A5s", "A4s", "A3s", "A2s", "K7s", "K6s", "87s", "76s", "65s", "54s"];
      const offsuitBroadways = ["KJo", "KTo", "QJo", "QTo", "JTo", "A9o", "A8o"];
      const smallPairs = ["55", "44", "33", "22"];

      for (const [hand, f] of Object.entries(gto)) {
        let { raise, call, fold } = f;
        if (mode === "RFI") {
          if (suitedWheels.includes(hand) && raise > 0 && raise < 100) raise = Math.max(0, raise - 30);
          else if (offsuitBroadways.includes(hand) && raise > 0 && raise < 80) raise = Math.min(100, raise + 25);
          call = 0;
          fold = 100 - raise;
        } else if (mode === "VS_OPEN_IP") {
          if (suitedWheels.includes(hand) && raise > 0) {
            const shift = Math.min(raise, 45);
            raise -= shift;
            call += Math.round(shift * 0.6);
          } else if (offsuitBroadways.includes(hand)) {
            call = Math.min(100 - raise, call + 25);
          }
          fold = Math.max(0, 100 - raise - call);
        } else if (mode === "VS_OPEN_BB") {
          if (suitedWheels.includes(hand) && raise > 0) {
            const shift = Math.min(raise, 50);
            raise -= shift;
            call += shift;
          } else if (smallPairs.includes(hand) && call > 0) {
            call = Math.max(0, call - 25);
          }
          fold = Math.max(0, 100 - raise - call);
        } else if (mode === "VS_3BET") {
          if (suitedWheels.includes(hand) && raise > 0) {
            const shift = Math.min(raise, 55);
            raise -= shift;
            fold += shift;
          } else if (smallPairs.includes(hand) && call > 0) {
            call = Math.max(0, call - 25);
          }
          fold = Math.max(0, 100 - raise - call);
        }
        hero[hand] = { raise: Math.round(raise), call: Math.round(call), fold: Math.max(0, 100 - Math.round(raise) - Math.round(call)) };
      }
      return hero;
    }

                          const hero = scenario.pt4HeroFrequencies[hand];
                          const src = matrixMode === "HERO" ? hero : gto;
                          const hasLeak = Math.abs(gto.raise - hero.raise) >= 20 || Math.abs(gto.call - hero.call) >= 20;

                          return (
                            <button
                              key={hand}
                              onClick={() => setSelectedHand(hand)}
                              onMouseEnter={() => setSelectedHand(hand)}
                              className={`h-10 sm:h-12 rounded-md p-1 flex flex-col justify-between text-left border transition-all ${
                                selectedHand === hand
                                  ? "ring-2 ring-white border-white z-10 scale-105"
                                  : matrixMode === "DIFF" && hasLeak
                                  ? "border-amber-400 ring-1 ring-amber-400/50"
                                  : "border-slate-800"
                              }`}
                              style={{
                                background: `linear-gradient(to right, #f43f5e 0%, #f43f5e ${src.raise}%, #10b981 ${src.raise}%, #10b981 ${src.raise + src.call}%, #0f172a ${src.raise + src.call}%, #0f172a 100%)`
                              }}
                            >
                              <span className={`text-[10px] sm:text-xs font-bold leading-none ${src.raise + src.call > 15 ? "text-white" : "text-slate-400"}`}>
                                {hand}
                              </span>
                              {matrixMode === "DIFF" && hasLeak ? (
                                <span className="text-[9px] font-black text-amber-300 bg-slate-950/90 px-1 rounded">
                                  Leak
                                </span>
                              ) : (src.raise + src.call > 0 && src.raise + src.call < 100) ? (
                                <span className="text-[9px] font-semibold text-white bg-slate-950/60 px-1 rounded">
                                  {src.raise > 0 ? `${src.raise}%` : `${src.call}%`}
                                </span>
                              ) : null}
                            </button>
                          );
                        })
                      )}
                    </div>
                  </div>

                  {/* Inspector */}
                  <div className="xl:col-span-4 space-y-5">
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl">
                      <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Inspector de Mano</span>
                      <div className="flex items-center justify-between mt-1 mb-4">
                        <span className="text-3xl font-black text-white">{selectedHand}</span>
                        <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-800 text-emerald-400">
                          {getHandCombos(selectedHand)} combos · {scenario.sizing}
                        </span>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div>
                          <div className="flex justify-between mb-1 font-semibold">
                            <span>Frecuencia GTO Óptima</span>
                            <span>{activeGto.raise}% Raise / {activeGto.call}% Call / {activeGto.fold}% Fold</span>
                          </div>
                          <div className="w-full h-5 rounded-lg overflow-hidden flex bg-slate-950 border border-slate-800">
                            <div style={{width:`${activeGto.raise}%`}} className="bg-rose-500"/>
                            <div style={{width:`${activeGto.call}%`}} className="bg-emerald-500"/>
                          </div>
                        </div>

                        <div>
                          <div className="flex justify-between mb-1 font-semibold text-indigo-300">
                            <span>Tu Frecuencia en PT4</span>
                            <span>{activeHero.raise}% Raise / {activeHero.call}% Call / {activeHero.fold}% Fold</span>
                          </div>
                          <div className="w-full h-5 rounded-lg overflow-hidden flex bg-slate-950 border border-slate-800">
                            <div style={{width:`${activeHero.raise}%`}} className="bg-rose-500/80"/>
                            <div style={{width:`${activeHero.call}%`}} className="bg-emerald-500/80"/>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl">
                      <h4 className="text-sm font-bold text-white mb-3">Claves del Coach para este Spot</h4>
                      <ul className="space-y-2.5 text-xs text-slate-300 leading-relaxed">
                        {scenario.coachNotes.map((n, i) => (
                          <li key={i} className="flex items-start gap-2">
                            <span className="w-1.5 h-1.5 rounded-full bg-rose-500 mt-1.5 shrink-0"/>
                            <span>{n}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "POSTFLOP" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {POSTFLOP_SPOTS.map(sp => (
                    <button
                      key={sp.id}
                      onClick={() => { setPostflopSpotId(sp.id); setPostflopStreet("FLOP"); }}
                      className={`p-4 rounded-2xl border text-left transition-all ${
                        sp.id === postflopSpot.id
                          ? "bg-slate-900 border-rose-500 ring-1 ring-rose-500/40"
                          : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                      }`}
                    >
                      <div className="flex justify-between text-xs text-slate-400 font-bold mb-1">
                        <span>{sp.positions}</span>
                        <span>SPR {sp.spr}</span>
                      </div>
                      <div className="text-base font-black text-white mb-2">{sp.spotName}</div>
                      <div className="flex gap-1.5">
                        {sp.cards.map((c, idx) => (
                          <span key={idx} className={`px-2.5 py-1 rounded-lg border text-xs font-black ${c.c}`}>
                            {c.r}{c.s}
                          </span>
                        ))}
                      </div>
                    </button>
                  ))}
                </div>

                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
                    <div>
                      <span className="text-xs font-bold text-rose-400 uppercase">{postflopSpot.positions} · Bote {postflopSpot.potBb} bb</span>
                      <h3 className="text-xl font-black text-white mt-0.5">{streetPlan.title}</h3>
                    </div>
                    <div className="flex gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                      {["FLOP", "TURN", "RIVER"].map(st => (
                        <button
                          key={st}
                          onClick={() => setPostflopStreet(st)}
                          className={`px-4 py-2 rounded-lg text-xs font-bold ${
                            postflopStreet === st ? "bg-rose-600 text-white" : "text-slate-400 hover:text-white"
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <p className="text-sm text-slate-200 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800">
                    {streetPlan.summary}
                  </p>

                  <div className="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200">
                    <strong className="text-amber-300">Alerta de Leak PT4: </strong>{postflopSpot.pt4Warning}
                  </div>

                  <div className="space-y-3">
                    <h4 className="text-sm font-bold text-white">Cómo Jugar Cada Categoría de Mano en {postflopStreet}</h4>
                    {streetPlan.categories.map((cat, i) => (
                      <div key={i} className="p-4 rounded-xl bg-slate-950 border border-slate-800 grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
                        <div className="lg:col-span-4">
                          <span className="text-sm font-bold text-white block">{cat.name}</span>
                          <span className="text-xs text-slate-400">{cat.share}% del rango</span>
                        </div>
                        <div className="lg:col-span-4">
                          <div className="w-full h-6 rounded-lg overflow-hidden flex bg-slate-900 border border-slate-800 text-[10px] font-bold">
                            {cat.ob > 0 && <div style={{width:`${cat.ob}%`}} className="bg-purple-600 text-white flex items-center justify-center">OB {cat.ob}%</div>}
                            {cat.b75 > 0 && <div style={{width:`${cat.b75}%`}} className="bg-rose-600 text-white flex items-center justify-center">75% ({cat.b75}%)</div>}
                            {cat.b33 > 0 && <div style={{width:`${cat.b33}%`}} className="bg-amber-500 text-slate-950 flex items-center justify-center">33% ({cat.b33}%)</div>}
                            {cat.check > 0 && <div style={{width:`${cat.check}%`}} className="bg-emerald-600 text-white flex items-center justify-center">Chk {cat.check}%</div>}
                          </div>
                        </div>
                        <div className="lg:col-span-4 text-xs text-slate-300">{cat.note}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "PT4_LEAKS" && (
              <div className="space-y-6">
                {/* Summary KPIs */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-bold uppercase">Base de Datos en Red</span>
                    <div className="text-2xl font-black text-white mt-1">{pt4Db.totalHands.toLocaleString()} manos</div>
                    <span className="text-xs text-indigo-400 mt-1 block">{pt4Db.databaseName}</span>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-bold uppercase">Winrate & EV</span>
                    <div className="text-2xl font-black text-emerald-400 mt-1">+{pt4Db.bb100} bb/100</div>
                    <span className="text-xs text-slate-400 mt-1 block">All-In EV: +{pt4Db.evBb100} bb/100</span>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-bold uppercase">VPIP / PFR / 3-Bet</span>
                    <div className="text-2xl font-black text-white mt-1">{pt4Db.globalVpip}% / {pt4Db.globalPfr}% / {pt4Db.global3Bet}%</div>
                    <span className="text-xs text-slate-400 mt-1 block">Target GTO: 25% / 21% / 9.5%</span>
                  </div>
                  <div className="bg-gradient-to-br from-rose-950/80 to-slate-900 border border-rose-500/40 rounded-2xl p-5">
                    <span className="text-xs text-rose-300 font-bold uppercase">Potencial de Mejora</span>
                    <div className="text-2xl font-black text-rose-400 mt-1">+6.25 bb/100</div>
                    <span className="text-xs text-rose-200/80 mt-1 block">4 Leaks Críticos Detectados</span>
                  </div>
                </div>

                {/* Position Table */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 overflow-x-auto">
                  <h3 className="text-lg font-extrabold text-white mb-4">Rendimiento por Posición (PT4 vs Objetivo GTO)</h3>
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 uppercase">
                        <th className="py-3 px-3">Posición</th>
                        <th className="py-3 px-3">Manos</th>
                        <th className="py-3 px-3">Tu VPIP (GTO)</th>
                        <th className="py-3 px-3">PFR %</th>
                        <th className="py-3 px-3">3-Bet %</th>
                        <th className="py-3 px-3">Cold Call %</th>
                        <th className="py-3 px-3">Winrate</th>
                        <th className="py-3 px-3 text-right">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {Object.values(pt4Db.positions).map(p => (
                        <tr key={p.pos} className="hover:bg-slate-800/40">
                          <td className="py-3 px-3 font-black text-white">{p.pos}</td>
                          <td className="py-3 px-3 text-slate-300">{p.hands.toLocaleString()}</td>
                          <td className="py-3 px-3 font-bold text-white">{p.vpip}% <span className="text-slate-500">({p.gtoVpip})</span></td>
                          <td className="py-3 px-3 font-bold text-slate-200">{p.pfr}%</td>
                          <td className="py-3 px-3 font-bold text-emerald-400">{p.threeBet}%</td>
                          <td className={`py-3 px-3 font-bold ${p.pos === "SB" && p.coldCall > 3 ? "text-rose-400" : "text-slate-200"}`}>{p.coldCall}%</td>
                          <td className="py-3 px-3 font-black text-emerald-400">{p.bb100 > 0 ? `+${p.bb100}` : p.bb100} bb/100</td>
                          <td className="py-3 px-3 text-right">
                            <button
                              onClick={() => {
                                const sc = PREFLOP_SCENARIOS.find(s => s.id === p.scenarioId);
                                if (sc) {
                                  setSelectedCategory(sc.category);
                                  setSelectedScenarioId(sc.id);
                                  setActiveTab("PREFLOP");
                                }
                              }}
                              className="px-3 py-1 rounded-lg bg-rose-500/20 text-rose-300 hover:bg-rose-600 hover:text-white font-bold"
                            >
                              Ver Tabla 13x13
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === "STUDY_ROOM" && (
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                <div className="xl:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300">
                      Entrenador Interactivo · {activeDrill.mode}
                    </span>
                    <span className="text-xs font-bold text-emerald-400">
                      Aciertos: {score.hits}/{score.played} · Racha: {score.streak}
                    </span>
                  </div>
                  <h3 className="text-lg font-black text-white mb-1">{activeDrill.title}</h3>
                  <p className="text-xs text-slate-300 mb-6">{activeDrill.situation}</p>

                  {/* 6-Max Felt */}
                  <div className="py-8 px-4 rounded-[40px] bg-gradient-to-b from-emerald-950/90 to-slate-950 border-4 border-slate-800 flex flex-col items-center justify-center min-h-[240px]">
                    <div className="px-4 py-1 rounded-full bg-slate-950 border border-emerald-500/40 text-xs font-extrabold text-emerald-300 mb-4">
                      Bote: {activeDrill.potBb} bb
                    </div>
                    {activeDrill.board.length > 0 && (
                      <div className="flex gap-2 mb-4">
                        {activeDrill.board.map((c, i) => (
                          <div key={i} className={`w-12 h-16 rounded-xl border-2 ${c.c} flex flex-col items-center justify-center font-black text-lg`}>
                            <span>{c.r}</span><span>{c.s}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex gap-2.5">
                      {activeDrill.heroCards.map((c, i) => (
                        <div key={i} className={`w-16 h-22 py-3 rounded-2xl border-2 ${c.c} flex flex-col items-center justify-center font-black text-2xl shadow-xl`}>
                          <span>{c.r}</span><span>{c.s}</span>
                        </div>
                      ))}
                    </div>
                    <span className="mt-2 text-xs font-bold text-white">Hero ({activeDrill.heroPos}): {activeDrill.hand}</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6">
                    {activeDrill.options.map(opt => (
                      <button
                        key={opt.id}
                        disabled={pickedOptionId !== null}
                        onClick={() => {
                          setPickedOptionId(opt.id);
                          setScore(s => ({
                            played: s.played + 1,
                            hits: s.hits + (opt.freq >= 50 ? 1 : 0),
                            streak: opt.freq >= 50 ? s.streak + 1 : 0
                          }));
                        }}
                        className={`p-3.5 rounded-xl border-2 text-left transition-all ${
                          pickedOptionId === opt.id
                            ? "border-white bg-slate-800"
                            : "border-slate-800 bg-slate-950 hover:border-rose-500"
                        }`}
                      >
                        <div className="flex justify-between font-black text-sm text-white">
                          <span>{opt.label}</span>
                          {pickedOptionId && <span className="text-emerald-400">{opt.freq}%</span>}
                        </div>
                        <span className="text-[11px] text-slate-400 block mt-1">
                          {pickedOptionId ? opt.ev : "Elegir acción"}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="xl:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                  {!pickedOptionId ? (
                    <div className="my-auto text-center py-12">
                      <h4 className="text-base font-bold text-white mb-2">Toma tu Decisión en la Mesa</h4>
                      <p className="text-xs text-slate-400">Elige la acción inferior para ver las frecuencias exactas del solver y la explicación del coach.</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-xs font-bold text-rose-400 uppercase block mb-1">Explicación del Coach</span>
                        <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">{activeDrill.explanation}</p>
                      </div>
                      <button
                        onClick={() => { setPickedOptionId(null); setDrillIdx(i => i + 1); }}
                        className="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm"
                      >
                        Siguiente Mano →
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Cloud PT4 Sync Modal */}
          {showSyncModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-extrabold text-white">Sincronizar PokerTracker 4 en Red</h3>
                  <button onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-400 mb-4">
                  Para analizar tu base de datos en la web desde cualquier dispositivo, exporta tu reporte por posición desde PokerTracker 4 (<b>Statistics → Position → Export CSV</b>) y súbelo aquí:
                </p>
                <label className="block w-full p-6 rounded-2xl border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 bg-slate-950 text-center cursor-pointer mb-4">
                  <span className="text-sm font-bold text-indigo-300 block mb-1">Haz clic para subir tu reporte CSV de PT4</span>
                  <span className="text-xs text-slate-400">Soporta reportes de Cash Games 6-Max y 9-Max</span>
                  <input type="file" accept=".csv,.txt" onChange={handleCsvUpload} className="hidden" />
                </label>
                {syncStatus && (
                  <div className="p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-xs text-emerald-300 font-bold mb-4">
                    {syncStatus}
                  </div>
                )}
                <div className="flex justify-end">
                  <button onClick={() => setShowSyncModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">
                    Listo
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
